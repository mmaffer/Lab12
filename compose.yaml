name: sem12-gimnasio
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-GymnasioDb}
      POSTGRES_USER: ${POSTGRES_USER:-gymnasio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - gimnasio-data:/var/lib/postgresql/data
      - ./scrip.sql:/docker-entrypoint-initdb.d/01-gimnasio.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  gimnasio-data:
